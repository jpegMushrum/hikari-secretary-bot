services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    env_file: ${BOT_ENV_FILE:-../.env}
    volumes:
      - ${BOT_DATA_DIR:-../data}:/app/data
    restart: "no"

  bot:
    build: .
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    env_file: ${BOT_ENV_FILE:-../.env}
    volumes:
      - ${BOT_DATA_DIR:-../data}:/app/data
      - ${BOT_TARGETS_FILE:-../targets.json}:/app/targets.json:ro
